services:
  bank-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-finchat}
      POSTGRES_USER: ${DB_USER:-finchat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finchat_secret}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finchat} -d ${DB_NAME:-finchat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${AI_DB_NAME:-finchat_ai}
      POSTGRES_USER: ${AI_DB_USER:-finchat_ai}
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD:-finchat_ai_secret}
    volumes:
      - ai_pgdata:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_DB_USER:-finchat_ai} -d ${AI_DB_NAME:-finchat_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_users &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      bank-db:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./ai-service:/app
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DJANGO_API_URL: http://backend:8000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AI_DB_URL: postgresql+asyncpg://${AI_DB_USER:-finchat_ai}:${AI_DB_PASSWORD:-finchat_ai_secret}@ai-db:5432/${AI_DB_NAME:-finchat_ai}
    ports:
      - "8001:8001"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      ai-db:
        condition: service_healthy

  accounts-mcp:
    build: ./accounts-mcp
    command: python server.py
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DJANGO_API_URL: http://backend:8000
    ports:
      - "8002:8002"
    depends_on:
      - backend

  transactions-mcp:
    build: ./transactions-mcp
    command: python server.py
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DJANGO_API_URL: http://backend:8000
    ports:
      - "8003:8003"
    depends_on:
      - backend

  service-mcp:
    build: ./service-mcp
    command: python server.py
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DJANGO_API_URL: http://backend:8000
    ports:
      - "8004:8004"
    depends_on:
      - backend

volumes:
  pgdata:
  ai_pgdata:
