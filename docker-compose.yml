services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-finchat}
      POSTGRES_USER: ${DB_USER:-finchat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finchat_secret}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finchat} -d ${DB_NAME:-finchat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_users &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

